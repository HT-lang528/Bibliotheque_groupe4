<p>Liste des Auteurs</p>

<table>
    <thead>

        <tr>
            <th>Nom</th>
            <th>Prenom</th>
            <th>nationalite</th>


        </tr>
    </thead>
<tbody>
    @for(auteur of auteurs.value();track auteur.id){

        <tr>
        <td>{{ auteur.nom }}</td>
        <td>{{ auteur.prenom }}</td>
        <td>{{ auteur.nationalite }}</td>
        <td>
          <button (click)="editer(auteur)">Editer</button>
          <button (click)="supprimer(auteur)">Supprimer</button>
        </td>
        
      </tr>



    }


</tbody>



</table>

<div>
    <div>
        <input type="text" [(ngModel)]="formAuteur.nom" />
        <input type="text" [(ngModel)]="formAuteur.prenom" />
        <input type="text" [(ngModel)]="formAuteur.nationalite" />
    </div>

<div>
    <div>
    <button (click)="ajouterOuModifier()">{{ formAuteur.id ? 'Modifier' : 'Ajouter' }}</button>

    @if (formAuteur.id) {
      <button (click)="annulerEdition()">Annuler</button>
    }
  </div>
</div>

</div>
