<h1>Liste des collections</h1>

<form (ngSubmit)="ajouterOuModifier()" [formGroup]="formCollectionGroup">
  <div>
    
    <label for="collection-nom">Nom de la collection</label>
    <input id="collection-nom" type="text" [formControl]="formCollectionNomCtrl" />
  </div>

  @if (formCollectionNomCtrl.dirty && formCollectionNomCtrl.hasError('required')) {
    <div>
      Le libellé est obligatoire !
    </div>
  }

  <div>
    <button [disabled]="formCollectionGroup.invalid || saving" type="submit">{{ editingCollectionId === undefined ? "Ajouter" : "Modifier" }}</button>
    <button type="button" (click)="annulerEdition()" [disabled]="saving">Annuler</button>
  </div>
</form>
@if (erreur) { <p role="alert">{{ erreur }}</p> }

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Libellé</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    @for (collection of (collections$ | async); track collection.id) {
      <tr>
        <td>{{ collection.id }}</td>
        <td>{{ collection.nom }}</td>
        <td>
          <button (click)="editer(collection)">Editer</button>
          <button (click)="supprimer(collection)">Supprimer</button>
        </td>
      </tr>
    }
  </tbody>
</table>
